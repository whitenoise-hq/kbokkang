name: 경기 일정 수집 (수동 복구용)

# ⚠️ **정기 실행은 Supabase Cron(pg_cron)이 한다** — 월요일 KST 09:00.
# `schedule:` 을 되살리지 말 것. 이유는 kbo-settle.yml 주석 참조.
#
# 여기 남겨둔 이유는 빠진 주를 다시 채우는 수동 경로가 필요해서다.
on:
  workflow_dispatch:
    inputs:
      date:
        description: '수집 시작일 (YYYY-MM-DD). 비우면 오늘부터 7일치.'
        required: false
        type: string

concurrency:
  group: kbo-schedule
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 일정 수집
        working-directory: apps/crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm schedule -- --date=${{ inputs.date }}
