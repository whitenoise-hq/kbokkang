name: 경기 결과 수집 · 정산

# UTC 01:07~15:37 30분 간격 = KST 10:07~00:37
#
# ⚠️ 분을 정시(0,30)에서 옮긴 이유: GitHub 문서가 "high load times include the start of
# every hour" 라며 큐에 들어간 작업이 **버려질 수 있다**고 명시한다. 실제로 2026-09-01 에
# 예정된 약 30회 중 2회만 실행됐다(하나는 18분 지연).
#
# 다만 이건 확률을 줄이는 것뿐이고 보장이 아니다. **정산 스크립트가 최근 3일을 훑어
# 자기복구하는 것이 진짜 방어선이다** — 실행이 빠져도 다음 실행이 주워간다.
#
# 창이 KST 자정을 넘어가도(00:07·00:37) 어제가 조회 범위 안이라 문제없다.
# 창 안이 전부 정산 완료면 스크립트가 소스를 부르지 않고 즉시 끝난다(경기 없는 날도 동일).
on:
  schedule:
    - cron: '7,37 1-15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '정산 대상 날짜 (YYYY-MM-DD). 비우면 오늘. 수집이 멈췄던 날의 복구용.'
        required: false
        type: string

# 정산은 포인트를 지급한다. 두 실행이 겹치면 같은 경기를 두 번 정산할 수 있다.
# settle_game() 이 for update 락 + status 검사로 막지만, 워크플로 단계에서도 막는다.
concurrency:
  group: kbo-settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 결과 수집 · 정산
        working-directory: apps/crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm settle -- --date=${{ inputs.date }}
