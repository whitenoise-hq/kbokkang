name: 경기 결과 수집 · 정산 (수동 복구용)

# ⚠️ **정기 실행은 Supabase Cron(pg_cron)이 한다.** 이 워크플로에 `schedule:` 을 되살리지 말 것 —
# 이중 정산은 settle_game() 의 락·상태 검사로 막히지만 소스 호출이 두 배가 된다.
#
# GitHub Actions `schedule` 을 버린 이유(실측):
# 09-01 예정 약 30회 중 2회, 09-02 는 4회만 실제로 만들어졌다. GitHub 문서가 부하 시 큐 작업이
# **버려진다**고 명시한다. 실효 간격이 4~5시간이 되어 정산이 경기 종료 2시간 30분 뒤에 됐다.
#
# 여기 남겨둔 이유는 **로그 보기 편한 수동 복구 경로**가 필요해서다.
# 이 CLI 는 항상 force 로 돌아 게이트를 무시한다(사람이 직접 부른 것이므로).
on:
  workflow_dispatch:
    inputs:
      date:
        description: '정산 기준일 (YYYY-MM-DD). 비우면 오늘. 이 날짜까지 최근 3일을 훑는다.'
        required: false
        type: string

concurrency:
  group: kbo-settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 결과 수집 · 정산
        working-directory: apps/crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm settle -- --date=${{ inputs.date }}
